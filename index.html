<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>קנין חכמה</title><style>:root{--ink:#172033;--muted:#687386;--paper:#fff;--bg:#f4f6fa;--accent:#b68a35;--accent2:#183b5b;--line:#e4e8ef}*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans Hebrew",sans-serif;background:var(--bg);color:var(--ink)}.wrap{max-width:1200px;margin:auto;padding:24px}.hero{background:linear-gradient(135deg,#173a59,#284f70);color:white;border-radius:24px;padding:42px 28px;margin-bottom:24px;box-shadow:0 14px 35px #102b451c}.hero h1{font-size:44px;margin:0 0 8px;font-weight:800}.hero p{margin:0;color:#dbe7f1;font-size:18px}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.card{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:25px;cursor:pointer;transition:.2s;box-shadow:0 8px 22px #1720330c}.card:hover{transform:translateY(-3px);box-shadow:0 14px 30px #17203316}.card h2{margin:0 0 12px;font-size:28px}.meta{display:flex;gap:8px;flex-wrap:wrap}.pill{display:inline-block;background:#f2eadb;color:#78571c;border-radius:999px;padding:6px 11px;font-size:13px;font-weight:700}.view{display:none}.view.active{display:block}.top{display:flex;justify-content:space-between;gap:15px;align-items:center;margin:8px 0 18px;flex-wrap:wrap}.back{border:0;background:#fff;border:1px solid var(--line);padding:10px 16px;border-radius:12px;cursor:pointer;font-weight:700}.title h2{margin:0;font-size:30px}.title p{margin:5px 0;color:var(--muted)}input{width:100%;max-width:390px;padding:13px 15px;border:1px solid var(--line);border-radius:12px;font-size:16px;background:#fff}.tablebox{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:auto;box-shadow:0 8px 24px #1720330b}table{width:100%;border-collapse:collapse;min-width:900px}th{background:#eef2f6;color:#334155;font-size:14px;position:sticky;top:0}th,td{padding:14px 13px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}tbody tr:hover{background:#fafbfd}footer{text-align:center;color:#8a94a4;padding:28px 0 8px;font-size:13px}@media(max-width:700px){.wrap{padding:14px}.hero{padding:30px 20px;border-radius:18px}.hero h1{font-size:34px}.cards{grid-template-columns:1fr}.card h2{font-size:24px}.top{align-items:stretch}.title{width:100%}input{max-width:none}}</style></head><body><main class="wrap"><section class="hero"><h1>קנין חכמה</h1><p>תכניות לימוד מסודרות — מסכת סנהדרין ומסכת בבא קמא</p></section><section id="home"><div class="cards" id="cards"></div></section><section id="sanhedrin" class="view"></section><section id="bavakama" class="view"></section><footer>קנין חכמה · תכנית לימוד תשפ״ז–תשפ״ח</footer></main><script src="data.js"></script><script src="app.js"></script></body></html>
