<script id="compact-plan-js">
(function(){
  let planRows=[], idx=0;
  function hebNum(n){
    const a=["","א","ב","ג","ד","ה","ו","ז","ח","ט","י","יא","יב","יג","יד","טו","טז","יז","יח","יט","כ"];
    return a[n]||String(n);
  }
  function collect(){
    const rows=[...document.querySelectorAll("#plan table tbody tr")];
    planRows=rows.map((tr,i)=>{
      const c=[...tr.children].map(x=>x.textContent.trim());
      return {week:c[0]||("שבוע "+(i+1)),dates:c[1]||"",parsha:c[2]||"",hespek:c[4]||"",perek:c[5]||""};
    });
    if(!planRows.length){
      planRows=[{week:"שבוע 1",dates:"ל׳ תשרי תשפ״ז – ו׳ חשון תשפ״ז",parsha:"נח",hespek:"דף ב׳ ע״א – דף ג׳ ע״א",perek:"פרק א׳ – דיני ממונות בשלשה"}];
    }
    idx=0; render();
  }
  function render(){
    const r=planRows[idx];
    const $=id=>document.getElementById(id);
    if(!$("planTitle"))return;
    $("planCounter").textContent=r.week;
    $("planTitle").textContent=r.week;
    $("planDates").textContent=r.dates;
    $("planParsha").textContent=r.parsha ? "פרשת "+r.parsha : "";
    $("planDapim").textContent=r.hespek || "";
    $("planStatus").textContent=r.perek || "שבוע לימוד";
    $("planLabel").textContent=idx===0?"השבוע הנוכחי":"שבוע "+(idx+1);
    $("planPrev").disabled=idx===0;
    $("planNext").disabled=idx===planRows.length-1;
    $("planPrev").style.opacity=$("planNext").style.opacity="1";
    const all=$("planAll");
    all.innerHTML=planRows.map((x,i)=>`<div class="plan-all-row ${i===idx?'current':''}">
      <b>${x.week}</b><span>${x.dates}</span><strong>${x.parsha}</strong>
    </div>`).join("");
  }
  document.addEventListener("click",e=>{
    if(e.target.id==="planPrev"&&idx>0){idx--;render()}
    if(e.target.id==="planNext"&&idx<planRows.length-1){idx++;render()}
    if(e.target.id==="planMore"){
      const a=document.getElementById("planAll"), b=document.getElementById("planMore");
      a.classList.toggle("open"); b.textContent=a.classList.contains("open")?"הסתר את התכנית ↑":"הצג את כל התכנית ↓";
    }
  });
  document.addEventListener("DOMContentLoaded",()=>setTimeout(collect,250));
  window.addEventListener("kinyan-data-ready",()=>setTimeout(collect,250));
})();
</script>

<script>
(function(){
  async function loadPersonalFlashcardStats(){
    const box=document.getElementById('personalFlashcardStatsBody');
    if(!box || typeof sb==='undefined') return;
    try{
      const {data:{user}}=await sb.auth.getUser();
      if(!user){ box.textContent='יש להתחבר כדי לראות את נתוני החזרה.'; return; }

      // Read the user's card progress. The migration created kch_flashcard_progress.
      const {data,error}=await sb.from('kch_flashcard_progress')
        .select('card_id,masechet,status,updated_at')
        .eq('user_id',user.id);

      if(error){ box.textContent='לא ניתן לטעון את נתוני הכרטיסיות כרגע.'; return; }

      const rows=data||[];
      const total=rows.length;
      const known=rows.filter(r=>r.status==='known'||r.status==='ידעתי').length;
      const review=rows.filter(r=>r.status==='review'||r.status==='צריך חזרה').length;

      // Current week: use the app's existing current-week helper/data when available.
      let weekLabel='';
      try{
        if(typeof getCurrentWeekNo==='function'){
          weekLabel='שבוע '+getCurrentWeekNo();
        } else if(typeof currentWeekNo!=='undefined'){
          weekLabel='שבוע '+currentWeekNo;
        }
      }catch(e){}

      box.innerHTML =
        '<div style="display:flex;gap:10px;flex-wrap:wrap">'+
          '<div><b>'+total+'</b> כרטיסיות שנענו</div>'+
          '<div><b>'+known+'</b> ידעתי</div>'+
          '<div><b>'+review+'</b> צריך חזרה</div>'+
        '</div>'+
        (weekLabel?'<div style="margin-top:7px;font-size:13px">'+weekLabel+'</div>':'');
    }catch(e){
      if(box) box.textContent='לא ניתן לטעון את נתוני החזרה כרגע.';
    }
  }

  // Hook into common navigation/rendering functions without replacing them.
  const oldGo = window.go;
  if(typeof oldGo==='function'){
    window.go=function(view){
      const result=oldGo.apply(this,arguments);
      if(view==='personal') setTimeout(loadPersonalFlashcardStats,100);
      return result;
    };
  }

  document.addEventListener('DOMContentLoaded',function(){
    setTimeout(loadPersonalFlashcardStats,300);
  });

  window.loadPersonalFlashcardStats=loadPersonalFlashcardStats;
})();
</script>

 const pts=[];kchWeeklyRows.forEach(w=>{const a=[...String(w.daf_range||'').matchAll(/דף\s+([א-תךםןףץ]+)[׳״"']*\s+ע[״"׳']?([אב])/g)].map(m=>({daf:kchHebNumToInt(m[1]),amud:m[2]})).filter(x=>x.daf);pts.push(...a)});
 return pts.length>=2?{start:pts[0],end:pts[pts.length-1]}:null;
};
// No se presenta ni se mantiene un perfil de alumno; solo se consulta el rol del administrador.
async function refreshSession(){
 if(!sb)return;
 const {data:authData,error:authError}=await sb.auth.getUser();
 if(authError)console.warn('No se pudo leer la sesión:',authError);
 user=authData?.user||null;profile=null;
 if(user){
  let {data:p,error}=await sb.from('kch_profiles').select('id,full_name,role').eq('id',user.id).maybeSingle();
  if(error||!p){const fallback=await sb.from('profiles').select('id,full_name,role').eq('id',user.id).maybeSingle();if(!fallback.error&&fallback.data)p=fallback.data;}
  profile=p||null;
 }
 const nav=document.getElementById('adminNav');if(nav)nav.classList.remove('hidden');
}

async function kchSetupFinal(){
 document.body.classList.remove('theme-sanhedrin','theme-bava');document.body.classList.add(PAGE_MASECHET==='סנהדרין'?'theme-sanhedrin':'theme-bava');document.title='קנין תורה — מסכת '+PAGE_MASECHET;
 const switchLink=document.getElementById('switchMasechet');if(switchLink){switchLink.href=PAGE_MASECHET==='סנהדרין'?'?masechet=bava':location.pathname;switchLink.textContent=PAGE_MASECHET==='סנהדרין'?'מעבר למסכת בבא קמא ←':'← חזרה למסכת סנהדרין'}
 const personalNav=document.querySelector('.navbtn[data-view="personal"]');if(personalNav)personalNav.remove();const p=document.getElementById('personal');if(p)p.remove();const adminNav=document.getElementById('adminNav');if(adminNav){adminNav.classList.remove('hidden');adminNav.innerHTML='⚙<br>מנהל';adminNav.dataset.view='admin'}
 const nav=document.querySelector('nav');if(nav){const btns=[...nav.querySelectorAll('.navbtn')];btns.forEach(b=>b.classList.remove('active'));const h=nav.querySelector('[data-view="home"]');if(h)h.classList.add('active')}
 if(sb){try{await refreshSession()}catch(e){console.warn(e)}}bindNavigation();renderHome();
}
document.addEventListener('DOMContentLoaded',()=>setTimeout(kchSetupFinal,80));
</script>
