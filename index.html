<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#153b5b"><title>קנין חכמה | מעקב אישי</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{--navy:#0a2037;--gold:#c59a48;--paper:#fffdfa;--ink:#182638;--muted:#718093;--line:#e4dfd4;--green:#238052;--red:#b83a3a;--shadow:0 16px 40px rgba(10,32,55,.09)}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#f8f5ef,#efebe3);color:var(--ink);font-family:Arial,"Noto Sans Hebrew",sans-serif}button,input{font:inherit}button{cursor:pointer}.wrap{width:min(1000px,calc(100% - 24px));margin:auto;padding-bottom:105px}.top{padding:20px 0;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:900;color:var(--navy);font-size:24px}.brand small{display:block;color:var(--gold);font-size:11px;letter-spacing:2px}.outline,.primary,.secondary,.status,.switch{border-radius:12px;padding:10px 14px;border:1px solid var(--line);background:#fff;color:var(--navy);font-weight:800}.primary{background:var(--navy);border-color:var(--navy);color:#fff}.secondary{background:linear-gradient(135deg,#fff8e7,#ead29c);border-color:#e1c98f;color:#6f5424}.view{display:none}.view.active{display:block}.hero-card,.section-hero{border-radius:28px;background:linear-gradient(145deg,#081c31,#173b5d);color:#fff;padding:30px;box-shadow:var(--shadow);border:1px solid rgba(197,154,72,.35)}.hero-kicker,.section-hero span{display:inline-block;background:#f2dca9;color:#634b21;border-radius:999px;padding:7px 14px;font-weight:900;font-size:13px}.hero-card h1,.section-hero h2{margin:12px 0 7px;font-size:34px}.hero-card p,.section-hero p{margin:0;color:#c8d1dc;line-height:1.8}.section-head{display:flex;justify-content:space-between;align-items:center;gap:15px;margin:28px 2px 14px}.section-head h2,.section-head h3{margin:0;color:var(--navy)}.section-head p{margin:4px 0;color:var(--muted)}.card{background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:22px;margin:16px 0;box-shadow:0 8px 26px rgba(10,32,55,.05)}.current-week{border-top:4px solid var(--gold)}.week-top{display:flex;justify-content:space-between;align-items:center;gap:12px}.badge{display:inline-flex;background:#f5e9ce;color:#735720;border:1px solid #e5ce9a;border-radius:999px;padding:7px 12px;font-weight:900;font-size:13px}.current-week h2{font-size:29px;color:var(--navy);margin:20px 0 8px}.week-meta,.meta{color:var(--muted);line-height:1.7}.week-info-grid{display:grid;grid-template-columns:1fr 1fr;margin-top:20px;background:#102d4b;color:#fff;border-radius:18px;overflow:hidden}.week-info-grid>div{padding:15px;text-align:center}.week-info-grid>div+div{border-right:1px solid rgba(255,255,255,.15)}.week-info-grid small{display:block;color:#e0c477;margin-bottom:4px}.masechet-cards{display:grid;grid-template-columns:1fr 1fr;gap:16px}.masechet-card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:24px;cursor:pointer;transition:.2s}.masechet-card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:#d9c08a}.gold-dot{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:#f2e4c4;color:#8b682c;font-size:20px}.masechet-card h3{font-size:27px;margin:16px 0 7px;color:var(--navy)}.card-link{margin-top:18px;color:var(--navy);font-weight:900}.switches{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.switch.selected{background:var(--navy);color:#fff;border-color:var(--navy)}.bar{height:14px;background:#e8e2d7;border-radius:999px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#b98a34,#dfc174);border-radius:999px}.big-percent{font-size:42px;font-weight:900;color:var(--navy);text-align:center;margin:8px 0}.perek-line{padding:14px 0;border-bottom:1px solid var(--line)}.perek-line:last-child{border-bottom:0}.perek-line>div:first-child{display:flex;justify-content:space-between;gap:10px;margin-bottom:7px}.perek-line span{font-weight:900;color:var(--gold)}.perek-line small{color:var(--muted)}.table-card{padding:0;overflow:hidden}.table-card h3{padding:20px 22px;margin:0}.table-scroll{overflow:auto}table{width:100%;border-collapse:collapse;min-width:720px}th,td{padding:12px;text-align:right;border-bottom:1px solid var(--line);font-size:14px}th{background:#f4f0e7;color:#64563f}.current-row td{background:#fff8e5}.hespek{font-weight:900;color:#785b23}.auth-head{display:flex;gap:13px;align-items:center;margin-bottom:20px}.auth-head h2{margin:0;color:var(--navy)}.auth-head p{margin:3px 0;color:var(--muted)}.auth-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.auth-grid>div{padding:20px;border:1px solid var(--line);border-radius:20px;background:#fbfaf6}.auth-grid .signup{background:linear-gradient(145deg,#fffdf7,#f8f0df)}.auth-grid label{display:block;color:var(--navy);font-weight:900;margin:10px 0 7px}input{width:100%;padding:12px;border:1px solid #d8d2c5;border-radius:11px;background:#fff;outline:0;margin-bottom:7px}input:focus{border-color:#b99a60;box-shadow:0 0 0 3px rgba(185,154,96,.12)}.auth-grid button{width:100%;margin-top:8px}.success{color:var(--green);font-weight:800;margin-top:12px}.error{color:var(--red);font-weight:800;margin-top:12px}.profile-card{display:flex;justify-content:space-between;align-items:center}.stat-grid,.admin-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat,.admin-stats>div{background:#fff;border:1px solid var(--line);border-radius:20px;padding:17px}.stat small,.admin-stats small{display:block;color:var(--muted);font-weight:800}.stat strong,.admin-stats b{display:block;color:var(--navy);font-size:29px;margin-top:6px}.current-progress{border-top:4px solid var(--gold)}.status-buttons{display:flex;gap:8px;flex-wrap:wrap}.status{flex:1;min-width:130px}.status.chosen{background:var(--navy);color:#fff;border-color:var(--navy)}.save-msg{margin-top:10px;color:var(--muted);font-weight:800}.makeup{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.makeup>div:first-child span{display:block;color:var(--muted);font-size:13px;margin-top:3px}.mini-status{padding:6px 10px;border-radius:999px;font-size:12px;font-weight:900}.completed{background:#dff3e5;color:#18733e}.partial{background:#fff0d2;color:#a86700}.not_started{background:#f6e0e0;color:#a73434}.makeup-buttons{display:flex;gap:4px}.makeup-buttons button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 9px;font-weight:900}.detail-block{margin-top:18px;padding-top:15px;border-top:1px solid var(--line)}.detail-row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}.first-admin{border:1px solid #e0c88d;background:#fff9eb}.login-hint{text-align:center;padding:18px;color:var(--muted)}nav{position:fixed;z-index:30;bottom:9px;left:50%;transform:translateX(-50%);width:min(700px,calc(100% - 18px));height:72px;background:linear-gradient(145deg,#091c31,#143655);border:1px solid rgba(197,154,72,.25);border-radius:24px;display:flex;overflow:hidden;box-shadow:0 18px 42px rgba(0,0,0,.25)}nav button{flex:1;border:0;background:transparent;color:#aeb8c3;font-weight:800;font-size:13px}nav button.active{color:#f1d38d;background:rgba(197,154,72,.08);box-shadow:inset 0 -3px 0 var(--gold)}.hidden{display:none!important}@media(max-width:700px){.masechet-cards,.auth-grid{grid-template-columns:1fr}.stat-grid,.admin-stats{grid-template-columns:1fr 1fr}.hero-card h1,.section-hero h2{font-size:29px}.makeup{grid-template-columns:1fr auto}.makeup-buttons{grid-column:1/-1}.top-actions{display:none}}@media(max-width:450px){.wrap{width:min(100% - 16px,1000px)}.card{padding:18px}.status{min-width:100px}.week-info-grid{grid-template-columns:1fr}.week-info-grid>div+div{border-right:0;border-top:1px solid rgba(255,255,255,.15)}}
</style></head><body><div class="wrap"><header class="top"><div class="brand">קנין חכמה<small>תכנית לימוד ומעקב אישי</small></div><div class="top-actions"><button class="outline" onclick="go('home')">ראשי</button></div></header><main><section id="home" class="view active"></section><section id="plan" class="view"></section><section id="personal" class="view"></section><section id="admin" class="view"></section></main></div><nav><button class="navbtn active" data-view="home">⌂<br>ראשי</button><button class="navbtn" data-view="plan">▤<br>תכנית</button><button class="navbtn" data-view="personal">♙<br>אישי</button><button class="navbtn hidden" id="adminNav" data-view="admin">⚙<br>ניהול</button></nav><script src="data.js"></script><script src="app.js"></script></body></html>
